<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c5d8a"/>
      <stop offset="1" stop-color="#12405f"/>
    </linearGradient>
    <linearGradient id="pageshine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7f0f5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- stack of books -->
  <g>
    <rect x="126" y="330" width="260" height="34" rx="6" fill="#e7b23d"/>
    <rect x="140" y="296" width="232" height="34" rx="6" fill="#57b894"/>
    <rect x="154" y="262" width="204" height="34" rx="6" fill="#dd6b55"/>
  </g>

  <!-- open book / clipboard -->
  <g>
    <rect x="150" y="120" width="212" height="150" rx="14" fill="url(#pageshine)"/>
    <path d="M256 132 v138" stroke="#c9d7e0" stroke-width="4"/>
    <path d="M170 148 h72 M170 168 h72 M170 188 h56" stroke="#9fb4c2" stroke-width="7" stroke-linecap="round"/>
    <path d="M270 148 h72 M270 168 h72 M270 188 h56" stroke="#9fb4c2" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- check badge -->
  <circle cx="372" cy="252" r="46" fill="#3fae76" stroke="#12405f" stroke-width="8"/>
  <path d="M352 253 l14 14 28 -30" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
